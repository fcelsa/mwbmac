# Compilazione e test su ogni push e pull request. Nessun binario viene pubblicato:
# l'app si compila e si firma localmente (vedi README).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: App bundle (ad hoc signature)
        run: scripts/build-app.sh
